version: "3.9"

services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-authz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-authz}
      POSTGRES_DB: ${POSTGRES_DB:-authzdb}
    ports:
      - "5434:5432"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-authz} -d ${POSTGRES_DB:-authzdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth_service:
    build: ./auth_service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-authz}:${POSTGRES_PASSWORD:-authz}@postgres:5432/${POSTGRES_DB:-authzdb}
      REDIS_URL: redis://redis:6379/0
      INVALIDATE_CHANNEL: authz:invalidate
      DB_POOL_MIN_SIZE: "5"
      DB_POOL_MAX_SIZE: "20"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    build: ./gateway
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      AUTH_MODE: ${AUTH_MODE:-baseline}
      AUTH_SERVICE_URL: http://auth_service:8001
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: "60"
      INVALIDATE_CHANNEL: authz:invalidate
    ports:
      - "8019:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth_service:
        condition: service_started

volumes:
  pgdata:
