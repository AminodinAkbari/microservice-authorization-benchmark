# Redis 7 Deployment + ClusterIP Service (used by redis_ttl / redis_pubsub modes
# and by auth_service for invalidation publishing).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: authz-benchmark
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authz-benchmark
      component: redis
  template:
    metadata:
      labels:
        app: authz-benchmark
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          command: ["redis-server"]
          args: ["--appendonly", "no", "--save", ""]
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: authz-benchmark
    component: redis
spec:
  type: ClusterIP
  selector:
    app: authz-benchmark
    component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
