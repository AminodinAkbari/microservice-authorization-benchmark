# Shared ConfigMap and Secret for all authz-benchmark services, plus the
# gateway Deployment and Service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authz-config
  labels:
    app: authz-benchmark
data:
  AUTH_MODE: "baseline"
  AUTH_SERVICE_URL: "http://auth-service:8001"
  REDIS_URL: "redis://redis:6379/0"
  DATABASE_URL: "postgresql://authz:authz@postgres:5432/authzdb"
  CACHE_TTL_SECONDS: "60"
  INVALIDATE_CHANNEL: "authz:invalidate"
  DB_POOL_MIN_SIZE: "5"
  DB_POOL_MAX_SIZE: "20"
---
apiVersion: v1
kind: Secret
metadata:
  name: authz-secret
  labels:
    app: authz-benchmark
type: Opaque
stringData:
  SECRET_KEY: "change-me-in-production"
  POSTGRES_PASSWORD: "authz"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: authz-benchmark
    component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: authz-benchmark
      component: gateway
  template:
    metadata:
      labels:
        app: authz-benchmark
        component: gateway
    spec:
      containers:
        - name: gateway
          image: authz-benchmark/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: authz-config
            - secretRef:
                name: authz-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app: authz-benchmark
    component: gateway
spec:
  type: ClusterIP
  selector:
    app: authz-benchmark
    component: gateway
  ports:
    - name: http
      port: 8000
      targetPort: 8000
